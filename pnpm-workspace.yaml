ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shamefullyHoist: true
shellEmulator: true

packages:
  - apps/*
  - packages/*
  - examples/*
  - plugins/*
  - playground
  - demo
  - docs

overrides:
  '@vitest/eslint-plugin': 1.6.27
  oxfmt>tinypool: 2.1.2
  pm2>js-yaml: ^4.3.2
  socks>ip-address: ^10.7.6

patchedDependencies:
  mirai-ts@2.4.8: patches/mirai-ts@2.4.8.patch
  rss-feed-emitter@4.0.0: patches/rss-feed-emitter@4.0.0.patch

allowBuilds:
