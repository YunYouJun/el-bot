ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - hono@4.13.13

trustPolicy: no-downgrade
shamefullyHoist: true
shellEmulator: true

packages:
  - apps/*
  - packages/*
  - examples/*
  - plugins/*
  - playground
  - demo
  - docs

overrides:
  pm2>js-yaml: ^4.3.2
  request>form-data: ^2.5.6
  request>qs: ^6.16.0

allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  esbuild: true
  sagiri: false
  vue-demi: true

