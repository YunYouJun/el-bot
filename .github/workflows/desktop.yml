name: Desktop packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            label: macos-x64
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-2022
            label: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            label: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: ubuntu-22.04-arm
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/el-bot-client/src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm --filter @el-bot/client build
      - name: Test native client without launching it
        run: cargo test --release --locked --manifest-path apps/el-bot-client/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build preview installers
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/el-bot-client
          tauriScript: pnpm tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installers and checksums
        run: node scripts/stage-client-release.mjs ${{ matrix.target }} ${{ matrix.label }} ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: dist/desktop-${{ matrix.label }}/*
          if-no-files-found: error
          retention-days: 7
