name: Desktop packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            label: macos-arm64
            target: darwin/arm64
            bundles: dmg
          - os: macos-26-intel
            label: macos-x64
            target: darwin/amd64
            bundles: dmg
          - os: windows-2022
            label: windows-x64
            target: windows/amd64
            bundles: nsis
          - os: ubuntu-22.04
            label: linux-x64
            target: linux/amd64
            bundles: archive,deb
          - os: ubuntu-22.04-arm
            label: linux-arm64
            target: linux/arm64
            bundles: archive,deb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # The runner's Azure mirror can throttle large GTK/WebKit downloads.
          if [ '${{ runner.arch }}' = X64 ]; then
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
              -exec sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/el-bot-client/go.mod
          cache-dependency-path: apps/el-bot-client/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm --filter @el-bot/client typecheck
      - name: Test native client without launching it
        run: go -C apps/el-bot-client test ./...
      - name: Build MyGo preview installers
        run: pnpm --filter @el-bot/client desktop:build --platform ${{ matrix.target }}
      - name: Verify native Liquid Glass icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target="${{ matrix.target }}"
          node apps/el-bot-client/scripts/check-macos-icon.mjs "apps/el-bot-client/build/${target/\//-}/Yun Bot.app"
      - name: Collect installers and checksums
        run: node scripts/stage-client-release.mjs ${{ matrix.target }} ${{ matrix.label }} ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: dist/desktop-${{ matrix.label }}/*
          if-no-files-found: error
          retention-days: 7
