name: Desktop packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            label: macos-arm64
            target: darwin/arm64
            bundles: dmg
          - os: macos-26-intel
            label: macos-x64
            target: darwin/amd64
            bundles: dmg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/el-bot-client/go.mod
          cache-dependency-path: apps/el-bot-client/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/el-bot-client/native
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm --filter @el-bot/client typecheck
      - name: Test native client without connecting bots
        run: pnpm test:client
      - name: Build SwiftUI native installers
        run: pnpm --filter @el-bot/client desktop:build --platform ${{ matrix.target }}
      - name: Verify native Liquid Glass icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target="${{ matrix.target }}"
          node apps/el-bot-client/scripts/check-macos-icon.mjs "apps/macos/build/${target/\//-}/Yun.app"
      - name: Collect installers and checksums
        run: node scripts/stage-client-release.mjs ${{ matrix.target }} ${{ matrix.label }} ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: dist/desktop-${{ matrix.label }}/*
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build native iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @el-bot/client mobile:ios
