name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      archive: ${{ steps.release.outputs.archive }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate release tag and unpublished version
        id: release
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFile, readFile } from 'node:fs/promises'
          const { name, version } = JSON.parse(await readFile('packages/el-bot/package.json', 'utf8'))
          assert.equal(name, 'el-bot')
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/)
          assert.equal(process.env.RELEASE_REF, `v${version}`, 'Git tag must match packages/el-bot/package.json')
          const response = await fetch(`https://registry.npmjs.org/${name}/${version}`, { signal: AbortSignal.timeout(15000) })
          assert.equal(response.status, 404, response.ok ? `${name}@${version} is already published` : `Registry check failed: HTTP ${response.status}`)
          const distTag = version.includes('-') ? 'next' : 'latest'
          await appendFile(process.env.GITHUB_OUTPUT, `archive=./dist/${name}-${version}.tgz\ndist_tag=${distTag}\n`)
          NODE

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm typecheck:packages
      - run: pnpm --filter @el-bot/qq-codex exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm docs:build
      - run: pnpm --filter el-bot pack --pack-destination ./dist
      - name: Test the exact package that will be published
        env:
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: pnpm test:cli "$RELEASE_ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  compatibility:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Verify the exact tarball on the minimum supported Node version
        env:
          RELEASE_ARCHIVE: ${{ needs.build.outputs.archive }}
        run: pnpm test:cli "$RELEASE_ARCHIVE"

  publish:
    needs: [build, compatibility, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Publish through npm OIDC
        env:
          RELEASE_ARCHIVE: ${{ needs.build.outputs.archive }}
          RELEASE_DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish "$RELEASE_ARCHIVE" --access public --tag "$RELEASE_DIST_TAG" --provenance --ignore-scripts

  desktop:
    needs: build
    uses: ./.github/workflows/desktop.yml

  github-release:
    needs: [build, publish, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: Create GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          args=(--verify-tag --generate-notes)
          if [ "$RELEASE_DIST_TAG" != latest ]; then
            args+=(--prerelease)
          fi
          cat > release-notes.md <<'NOTES'
          本次包含 el-bot npm 包与 Tauri 客户端预览安装包。

          安装 CLI：`pnpm add -g el-bot@next`。桌面客户端仍需本机 Node.js、已登录的 Codex CLI 与对应版本 el-bot CLI。

          安装包支持 macOS arm64/x64（DMG）、Windows x64（NSIS）、Linux arm64/x64（AppImage、Debian）；每个平台附 SHA-256 校验文件。

          macOS 安装包使用 ad-hoc 签名，尚未 Apple 公证；Windows 安装包未配置发布者证书。均为预览包，正式签名与公证将在配置证书后另行接入。
          NOTES
          gh release create "$RELEASE_REF" desktop/* "${args[@]}" --notes-file release-notes.md
