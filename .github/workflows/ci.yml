name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build native iOS companion
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test HTTPS client
        run: swift test --package-path apps/ios/Modules/YunBotCore
      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate --spec apps/ios/project.yml
      - name: Build unsigned simulator app and UI tests
        run: >-
          xcodebuild -quiet -project apps/ios/YunBot.xcodeproj -scheme YunBot
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/ios/DerivedData CODE_SIGNING_ALLOWED=NO build-for-testing

  desktop:
    name: Build native installers
    uses: ./.github/workflows/desktop.yml

  lint:
    name: Lint and full typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Build and test packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/el-bot-client/go.mod
          cache-dependency-path: apps/el-bot-client/go.sum
      - run: pnpm build
      - run: pnpm typecheck:packages
      - run: pnpm --filter @el-bot/qq-codex exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:cli

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
