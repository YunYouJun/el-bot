[package]
name = "yun-client"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "Yun"
path = "src/main.rs"

[dependencies]
nsh-engine = "=0.4.0"
serde_json = "1"
fs2 = "0.4"
rand = "0.9"
sys-locale = "0.3"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = [ "png" ] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "=0.4.0"
dispatch2 = "0.3.1"
tray-icon = "0.26.1"
objc2-app-kit = { version = "0.3.2", features = [
  "NSSegmentedControl",
  "NSSegmentedCell",
  "NSToolbar",
  "NSToolbarItem"
] }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = "=0.4.0"
tray-icon = "0.26.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_Ole"
] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "=0.4.0"

[profile.release]
strip = true
lto = "thin"
