name: Yun
options:
  bundleIdPrefix: fun.yunle
  deploymentTarget:
    iOS: '17.0'
packages:
  YunApple:
    path: ../../packages/yun-apple
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ''
targets:
  Yun:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../el-bot-client/icons/ElBot.icon
        buildPhase: resources
    dependencies:
      - package: YunApple
        product: YunCore
      - package: YunApple
        product: YunUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.bot
        PRODUCT_NAME: Yun
        ASSETCATALOG_COMPILER_APPICON_NAME: ElBot
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Config/Simulator.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Config/Device.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 小云 Bot
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  Yun:
    build:
      targets:
        Yun: all
