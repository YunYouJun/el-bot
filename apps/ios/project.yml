name: YunBot
options:
  bundleIdPrefix: fun.yunle
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
packages:
  YunBotCore:
    path: Modules/YunBotCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ''
targets:
  YunBot:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: YunBotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.yunbot
        PRODUCT_NAME: Yun Bot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yun Bot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Config/Simulator.entitlements
  YunBotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: YunBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.yunbot.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  YunBot:
    build:
      targets:
        YunBot: all
    test:
      targets: [YunBotUITests]
